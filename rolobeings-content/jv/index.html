    <style>
      /* Entry overlay: w/ prompt and dot to click in */
      .entry-overlay {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: fixed;
        z-index: 888;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        overflow: auto;
        background-color: rgba(247, 247, 237, 0.95);
        opacity: 1; /* Fully visible */
        transition: opacity 1.5s ease; /* Smooth fade-out effect */
      }
      .hidden-entry-overlay {
        opacity: 0;
        pointer-events: none; /* Prevent interaction */
      }
      #entry-dot {
        width: 15px;
        height: 15px;
        background-color: transparent;
        border: 1px solid black;
        border-radius: 50%;
        cursor: pointer;
        transition: background-color 0.5s ease; /* Smooth fade-out effect */
      }
      #prompt-text {
        font-family: "Noto Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 300;
        font-size: 14px;
        font-style: normal;
        font-variation-settings: "wdth" 87.5;
        color: black;
      }

      #fish .stroke {
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: draw 1s ease forwards;
        opacity: 0;
      }
      #fish {
        transition: opacity 0.8s ease;
      }

      @keyframes draw {
        to {
          stroke-dashoffset: 0;
          opacity: 1;
        }
      }

      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f0f0f000;
        font-family: "Noto Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 200;
        font-size: 14px;
        font-style: normal;
        font-variation-settings: "wdth" 100;
        color: black;
        overflow: hidden;
      }

      p {
        white-space: pre-line;
      }

      /* Toggle styling */
      .toggle {
        display: flex;
        flex-direction: row;
        align-items: center;
        position: absolute;
        z-index: 99;
        right: 1rem;
        top: 1rem;
        font-family: "Noto Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 300;
        font-size: 13px;
        font-style: normal;
        font-variation-settings: "wdth" 87.5;
      }
      /* The box around the toggle */
      .switch {
        position: relative;
        display: inline-block;
        width: 2rem;
        height: 0.9rem;
        margin: 0rem 0.4rem;
      }

      /* Hide default HTML checkbox */
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      /* The slider */
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #9e9e9e;
        -webkit-transition: 0.4s;
        transition: 0.4s;
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 0.7rem;
        width: 0.7rem;
        left: 0.1rem;
        bottom: 0.1rem;
        background-color: white;
        -webkit-transition: 0.4s;
        transition: 0.4s;
      }

      input:checked + .slider {
        background-color: #9e9e9e;
      }

      input:focus + .slider {
        box-shadow: 0 0 1px #9e9e9e;
      }

      input:checked + .slider:before {
        -webkit-transform: translateX(1.1rem);
        -ms-transform: translateX(1.1rem);
        transform: translateX(1.1rem);
      }

      /* Rounded sliders */
      .slider.round {
        border-radius: 34px;
      }

      .slider.round:before {
        border-radius: 50%;
      }

      .italic {
        font-style: italic;
      }

      .slideshow-container {
        position: relative;
        width: 80vw;
        height: 80vh;
        overflow: visible;
      }

      .blob {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 105%;
        height: 80%;
        background: rgba(
          86,
          81,
          71,
          0.05
        ); /* solid fallback with transparency */
        border-radius: 50%;
        filter: blur(100px);
        will-change: transform, filter;
        backface-visibility: hidden;
        z-index: 0;
        display: block;
      }

      .blur {
        position: absolute;
        width: 100%;
        height: 100%;
        filter: blur(100px);
      }

      .text-slide {
        position: absolute;
        width: 60%;
        height: calc(100% - 4rem);
        color: white;

        font-weight: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: left;
        z-index: 10;
        padding: 2rem;
