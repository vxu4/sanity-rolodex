<!doctype html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wdth,wght@0,62.5..100,100..900;1,62.5..100,100..900&display=swap"
        rel="stylesheet" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
        p {
            font-family: "Noto Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 200;
            font-size: 12px;
            font-style: normal;
            font-variation-settings: "wdth" 100;
            color: black;
        }

        a {
            color: black;
        }

        .body {
            margin-left: 0.5vw;
        }

        /* Entry overlay: w/ prompt and dot to click in */
        .entry-overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: fixed;
            z-index: 888;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            overflow: auto;
            background-color: rgba(247, 247, 237, 0.95);
            opacity: 1;
            /* Fully visible */
            transition: opacity 1.5s ease;
            /* Smooth fade-out effect */
        }

        .hidden-entry-overlay {
            opacity: 0;
            pointer-events: none;
            /* Prevent interaction */
        }

        #entry-dot {
            width: 15px;
            height: 15px;
            background-color: transparent;
            border: 1px solid black;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.5s ease;
            /* Smooth fade-out effect */
        }

        .prompt-text {
            font-family: "Noto Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 300;
            font-size: 14px;
            font-style: normal;
            font-variation-settings: "wdth" 87.5;
            color: black;
        }

        .dot-nav {
            height: 100px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        .dot {
            position: absolute;
            height: 15px;
            width: 15px;
            background-color: transparent;
            border: 1px solid black;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
        }

        /* Positioning the dots in a triangle formation */
        #dot1 {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        #dot1::after {
            content: "Rolodex Homepage";
            font-family: "Noto Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 300;
            font-size: 10px;
            font-style: normal;
            font-variation-settings: "wdth" 100;
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(10%);
            background-color: black;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
            z-index: 15;
        }

        #dot1:hover::after {
            opacity: 1;
        }

        #dot2 {
            top: 60px;
            left: calc(50% - 30px);
        }

        #dot2::after {
            content: "Rolobeing Bio";
            font-family: "Noto Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 300;
            font-size: 10px;
            font-style: normal;
            font-variation-settings: "wdth" 100;
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-110%);
            background-color: black;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
            z-index: 15;
        }

        #dot2:hover::after {
            opacity: 1;
        }

        #dot3 {
            top: 60px;
            left: calc(50% + 15px);
            background-color: black;
        }

        #dot3::after {
            content: "Refresh Content";
            font-family: "Noto Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 300;
            font-size: 10px;
            font-style: normal;
            font-variation-settings: "wdth" 100;
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(10%);
            background-color: black;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
            z-index: 15;
        }

        #dot3:hover::after {
            opacity: 1;
        }

        /* Mobile view only on screens up to 768px wide */
        .mobile-only {
            display: flex;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 999;
            position: absolute;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #595959;
        }

        .redirect-message {
            color: #595959;
            text-align: center;
            font-family: "Noto Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 200;
            font-size: 14px;
            font-style: normal;
            font-variation-settings: "wdth" 100;
        }

        .rolodex {
            font-family: "Marzo", serif;
            font-size: 2.5rem;
            position: relative;
            cursor: pointer;
            text-align: center;
            margin-bottom: 1rem;
        }

        .solid-circle {
            position: relative;
            display: inline-block;
            width: 1.375rem;
            height: 1.375rem;
            border-radius: 50%;
            background-color: #595959;
        }

        .o1 {
            top: 0;
            left: 1.668rem;
            transform: translateX(-1.65rem);
        }

        .o2 {
            bottom: 0;
            left: -1.66rem;
            transform: translateX(1.65rem);
        }

        .footer {
            position: absolute;
            bottom: 1.5rem;
            right: 0rem;
            display: flex;
            justify-content: right;
            align-items: end;
            flex-direction: column;
            width: 100%;
        }

        #copyright {
            font-family: "didot", serif;
            font-style: italic;
            text-decoration: none;
            font-size: 14px;
            color: #595959;
            padding: 0rem 2rem;
        }

        @media (min-width: 769px) {
            .mobile-only {
                display: none;
            }
        }

        @media (max-width: 769px) {
            .entry-overlay {
                display: none;
            }

            .header {
                display: none;
            }

            .body {
                display: none;
            }
        }

        /* Toggle styling */
        .toggle {
            display: flex;
            flex-direction: row;
            align-items: center;
            position: absolute;
            z-index: 99;
            right: 1rem;
            top: 1rem;
            font-family: "Noto Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 300;
            font-size: 13px;
            font-style: normal;
            font-variation-settings: "wdth" 87.5;
        }

        /* The box around the toggle */
        .switch {
            position: relative;
            display: inline-block;
            width: 2rem;
            height: 0.9rem;
            margin: 0rem 0.4rem;
        }

        /* Hide default HTML checkbox */
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        /* The slider */
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #9e9e9e;
            -webkit-transition: 0.4s;
            transition: 0.4s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 0.7rem;
            width: 0.7rem;
            left: 0.1rem;
            bottom: 0.1rem;
            background-color: white;
            -webkit-transition: 0.4s;
            transition: 0.4s;
        }

        input:checked+.slider {
            background-color: #9e9e9e;
        }

        input:focus+.slider {
            box-shadow: 0 0 1px #9e9e9e;
        }

        input:checked+.slider:before {
            -webkit-transform: translateX(1.1rem);
            -ms-transform: translateX(1.1rem);
            transform: translateX(1.1rem);
        }

        /* Rounded sliders */
        .slider.round {
            border-radius: 34px;
        }

        .slider.round:before {
            border-radius: 50%;
        }

        .italic {
            font-style: italic;
        }

        .hidden {
            display: none !important;
        }

        .invisible {
            opacity: 0 !important;
        }

        .visible {
            opacity: 1 !important;
        }

        .show {
            display: absolute;
        }

        /* =========================================================
   INTERACTIVE PUZZLE
   ========================================================= */

        #interactive-view {
            width: 98vw;
            height: 97vh;
            position: relative;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /*
 * This is the puzzle's internal coordinate system.
 *
 * Your existing piece coordinates were designed around
 * approximately this size, so we keep those coordinates
 * intact and scale the entire canvas instead.
 */
        #puzzle-canvas {
            position: relative;

            width: 1400px;
            height: 850px;
            /* Try adjusting this number */
            /* margin-left: -77px; */
            flex-shrink: 0;

            transform-origin: center center;
        }

        /*
 * The quilt outline lives inside the same coordinate
 * system as the puzzle pieces.
 */
        #quilt-outline {
            position: absolute;

            width: 400px;

            /*
   * Centers the 400px outline inside the 1400px canvas.
   * The 225px top position centers it inside the 850px canvas.
   */
            width: 400px;
            left: 534px;
            top: 215px;

            display: block;
        }

        /*
 * Every puzzle piece is positioned relative to
 * #puzzle-canvas.
 */
        .quilt-piece {
            display: block;
            position: absolute;

            z-index: 35;
            cursor: pointer;

            /*
   * Prevents the browser from treating the image as
   * something it should drag as a normal image.
   */
            user-select: none;
            -webkit-user-drag: none;
        }

        /* herb dot styling */
        .herb-dot {
            width: 15px;
            height: 15px;
            background-color: transparent;
            border: 1px solid black;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.5s ease;
        }

        .herb-dot-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
        }

        .herb-text {
            transition: opacity 0.5s ease;
        }

        .herb-date {
            transition: opacity 0.5s ease;
        }

        #herb-dot-01-wrapper {
            left: 12vw;
            top: 11vh;
            opacity: 1;
            transition: opacity 0.5s ease;

        }

        #herb-dot-02-wrapper {
            left: 19vw;
            top: 38vh;
            opacity: 1;
            transition: opacity 0.5s ease;

        }

        #herb-dot-03-wrapper {
            left: 14vw;
            top: 65vh;
            opacity: 1;
            transition: opacity 0.5s ease;

        }

        #herb-dot-04-wrapper {
            right: 7vw;
            top: 23vh;
            opacity: 1;
            transition: opacity 0.5s ease;

        }

        #herb-dot-05-wrapper {
            right: 16vw;
            top: 57vh;
            opacity: 1;
            transition: opacity 0.5s ease;

        }

        .herb-quote-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: left;
            width: 30vw;
            position: absolute;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #herb-quote-01-wrapper {
            left: 4vw;
            top: 19vh;
            transition: opacity 0.5s ease;
        }

        #herb-quote-02-wrapper {
            left: 4vw;
            top: 46vh;
            transition: opacity 0.5s ease;
        }

        #herb-quote-03-wrapper {
            left: 4vw;
            top: 73vh;
            transition: opacity 0.5s ease;
        }

        #herb-quote-04-wrapper {
            right: -2vw;
            top: 31vh;
            transition: opacity 0.5s ease;
        }

        #herb-quote-05-wrapper {
            right: -2vw;
            top: 65vh;
            transition: opacity 0.5s ease;
        }

        .herb-quote {
            text-align: right;

        }

        .draggable {
            z-index: 40;
        }

        /* Archive view */
        #archive-view {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            margin-top: 14vh;
            height: 84vh;
            overflow: hidden;
        }

        #archive-index {
            display: flex;
            flex-direction: column;
            width: 10vw;
            position: absolute;
            top: 13vh;
            left: 2vw;
        }

        .index-title {
            margin: 0;
            cursor: pointer;
            padding-bottom: 1vh;
            font-style: italic !important;
        }

        .green-text {
            color: #9DDC93;
        }

        .black-text {
            color: black;
        }

        #herb-content {
            /* margin-left: -10vw; */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .subtitle {
            font-family: 'Noto Sans', sans-serif;
            font-optical-sizing: auto;
            font-weight: 300;
            font-style: normal;
            font-variation-settings: "wdth" 87.5;
            font-size: 15px;
            /* font-style: italic; */
        }

        .label-text {
            font-family: 'Noto Sans', sans-serif;
            font-optical-sizing: auto;
            font-weight: 100;
            font-style: normal;
            font-variation-settings: "wdth" 300;
            font-size: 10px;
            font-style: italic;
            align-self: flex-end;
        }

        .body-text {
            font-family: 'Noto Sans', sans-serif;
            font-optical-sizing: auto;
            font-weight: 100;
            font-style: normal;
            font-variation-settings: "wdth" 200;
            font-size: 14px;
            text-align: justify;
            align-self: flex-start;
        }

        .body-img {
            width: 20vw;
        }

        .caption-text {
            font-family: 'Noto Sans', sans-serif;
            font-optical-sizing: auto;
            font-weight: 100;
            font-style: italic;
            font-variation-settings: "wdth" 200;
            font-size: 12px;
            color: #595959;
            width: 35vw;
            text-align: center;
        }

        #herb-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: scroll;
            margin-top: 20vh;
            padding: 0px 10px;
            /* Create fade effect at top & bottom */
            -webkit-mask-image: linear-gradient(to bottom,
                    transparent,
                    black 5%,
                    black 80%,
                    transparent);
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-size: 100% 100%;
            mask-image: linear-gradient(to bottom,
                    transparent,
                    black 5%,
                    black 80%,
                    transparent);
            mask-repeat: no-repeat;
            mask-size: 100% 100%;
        }

        #essay-wrapper {
            width: 42vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 200px;

        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 5px;
            /* Width of the scrollbar */
        }

        ::-webkit-scrollbar-track {
            background: transparent;
            /* Background of the scrollbar track */
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(89, 89, 89, 0.2);
            /* Color of the scrollbar handle */
            border-radius: 5px;
            /* Rounded corners */
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(89, 89, 89, 0.3);
            /* Handle color on hover */
        }

        #title-img {
            height: 65vh;
        }
    </style>
</head>

<body>

    <script src="/components/dotnav.js"></script>
    <script src="/components/entryDot.js"></script>

    <entry-dot id="entryDot"></entry-dot>
    <dot-nav id="dotNav"></dot-nav>
    <div class="toggle">
        <p class="toggle-label-interactive italic">interactive read</p>
        <label class="switch">
            <input id="myInput" type="checkbox" />
            <span class="slider round"></span>
        </label>
        <p class="toggle-label-essay">full archive</p>
    </div>

    <div class="body">
        <div id="interactive-view" class="show">
            <div id="puzzle-canvas">
                <img id="quilt-outline" alt="Quilt outline" />
                <div id="dots-wrapper">
                    <div class="herb-dot-wrapper" id="herb-dot-01-wrapper">
                        <p class="herb-text invisible">Herb name loading</p>
                        <div class="herb-dot" id="herb-dot-01"></div>
                        <p class="herb-date invisible">Date loading</p>
                    </div>
                    <div class="herb-quote-wrapper" id="herb-quote-01-wrapper">
                        <p class="herb-quote" id="herb-quote-01"></p>
                    </div>

                    <div class="herb-dot-wrapper" id="herb-dot-02-wrapper">
                        <p class="herb-text invisible">Herb name loading</p>
                        <div class="herb-dot" id="herb-dot-02"></div>
                        <p class="herb-date invisible">Date loading</p>
                    </div>
                    <div class="herb-quote-wrapper" id="herb-quote-02-wrapper">
                        <p class="herb-quote" id="herb-quote-02"></p>
                    </div>

                    <div class="herb-dot-wrapper" id="herb-dot-03-wrapper">
                        <p class="herb-text invisible">Herb name loading</p>
                        <div class="herb-dot" id="herb-dot-03"></div>
                        <p class="herb-date invisible">Date loading</p>
                    </div>
                    <div class="herb-quote-wrapper" id="herb-quote-03-wrapper">
                        <p class="herb-quote" id="herb-quote-03"></p>
                    </div>

                    <div class="herb-dot-wrapper" id="herb-dot-04-wrapper">
                        <p class="herb-text invisible">Herb name loading</p>
                        <div class="herb-dot" id="herb-dot-04"></div>
                        <p class="herb-date invisible">Date loading</p>
                    </div>
                    <div class="herb-quote-wrapper" id="herb-quote-04-wrapper">
                        <p id="herb-quote-04"></p>
                    </div>

                    <div class="herb-dot-wrapper" id="herb-dot-05-wrapper">
                        <p class="herb-text invisible">Herb name loading</p>
                        <div class="herb-dot" id="herb-dot-05"></div>
                        <p class="herb-date invisible">Date loading</p>
                    </div>
                    <div class="herb-quote-wrapper" id="herb-quote-05-wrapper">
                        <p id="herb-quote-05"></p>
                    </div>
                </div>
            </div>
        </div>
        <div id="archive-view" class="hidden">
            <div id="archive-index"></div>
            <div id="herb-wrapper">
                <div id="essay-wrapper">
                    <p id="herb-name" class="subtitle">Dandelion</p>
                    <img id="title-img" src="" alt="" class="herb-image" />
                    <p class="subtitle" id="zodiac-season"></p>
                    <br />
                    <br />
                    <p class="label-text" id="publish-date">First published June 12th, 2024</p>
                    <div id="herb-content">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/rolobeings-content/mzyvb/script.js"></script>

</body>

</html>
