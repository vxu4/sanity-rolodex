<!doctype html>
<html lang="en">

<head>
    <link rel="stylesheet" href="../../global.css">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wdth,wght@0,62.5..100,100..900;1,62.5..100,100..900&display=swap"
        rel="stylesheet" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
        p {
            font-family: "Noto Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 200;
            font-size: 12px;
            font-style: normal;
            font-variation-settings: "wdth" 100;
            color: var(--black);
        }

        a {
            color: var(--black);
        }

        #gen-body {
            background-image: url(https://static.wixstatic.com/media/2fa7ac_e14ea4777657472b970da0e92f871751~mv2.jpg);
            background-size: 100vw;
            background-color: var(--yellow);
            /* backdrop-filter: blur(4px); Apply blur effect */
            margin: 0;
        }

        .body {
            margin-left: 0.5vw;
        }

        #instruction {
            position: absolute;
            top: 150px;
            left: 700px;
        }

        .italic {
            font-style: italic;
        }

        .hidden {
            display: none !important;
        }

        .invisible {
            opacity: 0 !important;
        }

        .visible {
            opacity: 1 !important;
        }

        .show {
            display: absolute;
        }

        /* =========================================================
   INTERACTIVE PUZZLE
   ========================================================= */

        #interactive-view {
            width: 98vw;
            height: 97vh;
            position: relative;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /*
 * This is the puzzle's internal coordinate system.
 *
 * Your existing piece coordinates were designed around
 * approximately this size, so we keep those coordinates
 * intact and scale the entire canvas instead.
 */
        #puzzle-canvas {
            position: relative;

            width: 1400px;
            height: 850px;
            /* Try adjusting this number */
            /* margin-left: -77px; */
            flex-shrink: 0;

            transform-origin: center center;
        }

        /*
 * The quilt outline lives inside the same coordinate
 * system as the puzzle pieces.
 */
        #quilt-outline {
            position: absolute;

            width: 400px;

            /*
   * Centers the 400px outline inside the 1400px canvas.
   * The 225px top position centers it inside the 850px canvas.
   */
            width: 400px;
            left: 534px;
            top: 215px;

            display: block;
        }

        /*
 * Every puzzle piece is positioned relative to
 * #puzzle-canvas.
 */
        .quilt-piece {
            display: block;
            position: absolute;

            z-index: 35;
            cursor: pointer;

            /*
   * Prevents the browser from treating the image as
   * something it should drag as a normal image.
   */
            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
        }

        /* herb dot styling */
        .herb-dot {
            width: 15px;
            height: 15px;
            background-color: transparent;
            border: 1px solid var(--black);
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.5s ease;
        }

        .herb-dot-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
        }

        .herb-text {
            transition: opacity 0.5s ease;
        }

        .herb-date {
            transition: opacity 0.5s ease;
        }

        #herb-dot-01-wrapper {
            left: 12vw;
            top: 11vh;
            opacity: 1;
            transition: opacity 0.5s ease;

        }

        #herb-dot-02-wrapper {
            left: 19vw;
            top: 38vh;
            opacity: 1;
            transition: opacity 0.5s ease;

        }

        #herb-dot-03-wrapper {
            left: 14vw;
            top: 65vh;
            opacity: 1;
            transition: opacity 0.5s ease;

        }

        #herb-dot-04-wrapper {
            right: 7vw;
            top: 23vh;
            opacity: 1;
            transition: opacity 0.5s ease;

        }

        #herb-dot-05-wrapper {
            right: 16vw;
            top: 57vh;
            opacity: 1;
            transition: opacity 0.5s ease;

        }

        .herb-quote-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: left;
            width: 30vw;
            position: absolute;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #herb-quote-01-wrapper {
            left: 4vw;
            top: 19vh;
            transition: opacity 0.5s ease;
        }

        #herb-quote-02-wrapper {
            left: 4vw;
            top: 46vh;
            transition: opacity 0.5s ease;
        }

        #herb-quote-03-wrapper {
            left: 4vw;
            top: 73vh;
            transition: opacity 0.5s ease;
        }

        #herb-quote-04-wrapper {
            right: -2vw;
            top: 31vh;
            transition: opacity 0.5s ease;
        }

        #herb-quote-05-wrapper {
            right: -2vw;
            top: 65vh;
            transition: opacity 0.5s ease;
        }

        .herb-quote {
            text-align: right;

        }

        .ref-image {
            position: absolute;
            cursor: grab;
        }

        .ref-image:active {
            cursor: grabbing;
        }

        .ref-image img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Archive view */
        #archive-view {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            margin-top: 14vh;
            height: 84vh;
            overflow: hidden;
        }

        #archive-index {
            display: flex;
            flex-direction: column;
            width: 10vw;
            position: absolute;
            top: 13vh;
            left: 2vw;
            z-index: 300;
        }

        .index-title {
            margin: 0;
            cursor: pointer;
            padding-bottom: 1vh;
            font-style: italic !important;
        }

        .green-text {
            color: #9DDC93;
        }

        .black-text {
            color: var(--black);
        }

        #herb-content {
            /* margin-left: -10vw; */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .subtitle {
            font-family: 'Noto Sans', sans-serif;
            font-optical-sizing: auto;
            font-weight: 300;
            font-style: normal;
            font-variation-settings: "wdth" 87.5;
            font-size: 15px;
            /* font-style: italic; */
        }

        .label-text {
            font-family: 'Noto Sans', sans-serif;
            font-optical-sizing: auto;
            font-weight: 100;
            font-style: normal;
            font-variation-settings: "wdth" 300;
            font-size: 10px;
            font-style: italic;
            align-self: flex-end;
        }

        .body-text {
            font-family: 'Noto Sans', sans-serif;
            font-optical-sizing: auto;
            font-weight: 100;
            font-style: normal;
            font-variation-settings: "wdth" 200;
            font-size: 14px;
            text-align: justify;
            align-self: flex-start;
        }

        .body-img {
            width: 20vw;
        }

        .caption-text {
            font-family: 'Noto Sans', sans-serif;
            font-optical-sizing: auto;
            font-weight: 100;
            font-style: italic;
            font-variation-settings: "wdth" 200;
            font-size: 12px;
            color: var(--grey);
            width: 35vw;
            text-align: center;
        }

        #herb-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: scroll;
            padding: 2rem 1rem;

        }

        #essay-wrapper {
            width: 42vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 200px;

        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 5px;
            /* Width of the scrollbar */
        }

        ::-webkit-scrollbar-track {
            background: transparent;
            /* Background of the scrollbar track */
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(89, 89, 89, 0.2);
            /* Color of the scrollbar handle */
            border-radius: 5px;
            /* Rounded corners */
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(89, 89, 89, 0.3);
            /* Handle color on hover */
        }

        #title-img {
            height: 65vh;
        }

        /* Mobile overlay CSS */
        .mobile-only {
            display: flex;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 999;
            position: absolute;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--grey);
        }

        @media (min-width: 769px) {
            .mobile-only {
                display: none;
            }
        }

        @media (max-width: 769px) {
            .header {
                display: none;
            }

            .container {
                display: none;
            }

            .footer {
                display: none;
            }

            .mobile-only {
                display: flex;
            }
        }
    </style>
</head>

<body id="gen-body">

    <script src="/components/dotnav.js"></script>
    <script src="/components/entryDot.js"></script>
    <script src="/components/scrollFade.js"></script>
    <script src="/components/essayToggle.js" defer></script>
    <script src="/components/draggable.js" defer></script>
    <script src="/components/rolodexTitle.js"></script>
    <script src="/components/mobileOverlay.js"></script>

    <mobile-overlay class="mobile-only"></mobile-overlay>
    <entry-dot id="entryDot"></entry-dot>
    <dot-nav id="dotNav"></dot-nav>
    <essay-toggle></essay-toggle>

    <div class="body">
        <div id="interactive-view" class="show">
            <div id="puzzle-canvas">
                <p id="instruction" class="subtitle" style="font-style: italic !important">let's garden</p>
                <img id="quilt-outline" alt="Quilt outline" />
                <div id="dots-wrapper">
                    <div class="herb-dot-wrapper" id="herb-dot-01-wrapper">
                        <p class="herb-text invisible">Herb name loading</p>
                        <div class="herb-dot" id="herb-dot-01"></div>
                        <p class="herb-date invisible">Date loading</p>
                    </div>
                    <div class="herb-quote-wrapper" id="herb-quote-01-wrapper">
                        <p class="herb-quote" id="herb-quote-01"></p>
                    </div>

                    <div class="herb-dot-wrapper" id="herb-dot-02-wrapper">
                        <p class="herb-text invisible">Herb name loading</p>
                        <div class="herb-dot" id="herb-dot-02"></div>
                        <p class="herb-date invisible">Date loading</p>
                    </div>
                    <div class="herb-quote-wrapper" id="herb-quote-02-wrapper">
                        <p class="herb-quote" id="herb-quote-02"></p>
                    </div>

                    <div class="herb-dot-wrapper" id="herb-dot-03-wrapper">
                        <p class="herb-text invisible">Herb name loading</p>
                        <div class="herb-dot" id="herb-dot-03"></div>
                        <p class="herb-date invisible">Date loading</p>
                    </div>
                    <div class="herb-quote-wrapper" id="herb-quote-03-wrapper">
                        <p class="herb-quote" id="herb-quote-03"></p>
                    </div>

                    <div class="herb-dot-wrapper" id="herb-dot-04-wrapper">
                        <p class="herb-text invisible">Herb name loading</p>
                        <div class="herb-dot" id="herb-dot-04"></div>
                        <p class="herb-date invisible">Date loading</p>
                    </div>
                    <div class="herb-quote-wrapper" id="herb-quote-04-wrapper">
                        <p id="herb-quote-04"></p>
                    </div>

                    <div class="herb-dot-wrapper" id="herb-dot-05-wrapper">
                        <p class="herb-text invisible">Herb name loading</p>
                        <div class="herb-dot" id="herb-dot-05"></div>
                        <p class="herb-date invisible">Date loading</p>
                    </div>
                    <div class="herb-quote-wrapper" id="herb-quote-05-wrapper">
                        <p id="herb-quote-05"></p>
                    </div>
                </div>

            </div>
        </div>
        <div id="archive-view" class="hidden">
            <div id="archive-index"></div>
            <fade-scroll>
                <div id="herb-wrapper">
                    <div id="essay-wrapper">
                        <p id="herb-name" class="subtitle">Dandelion</p>
                        <img id="title-img" src="" alt="" class="herb-image" />
                        <br />
                        <br />
                        <p class="label-text" id="publish-date">First published June 12th, 2024</p>
                        <div id="herb-content">
                        </div>
                    </div>
                </div>
            </fade-scroll>
        </div>
    </div>
    <script src="/rolobeings-content/mzyvb/script.js"></script>

</body>

</html>
