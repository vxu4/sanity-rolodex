<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wdth,wght@0,62.5..100,100..900;1,62.5..100,100..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elaine W Ho</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
      /* Entry overlay: w/ prompt and dot to click in */
      .entry-overlay {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: fixed;
        z-index: 888;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        overflow: auto;
        background-color: #f7f7ed;
        opacity: 1; /* Fully visible */
        transition: opacity 1.5s ease; /* Smooth fade-out effect */
      }
      .hidden-entry-overlay {
        opacity: 0;
        pointer-events: none; /* Prevent interaction */
      }
      .prompt-text {
        font-family: "Noto Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 300;
        font-size: 15px;
        font-style: normal;
        font-variation-settings: "wdth" 87.5;
        color: black;
      }
      #entry-dot {
        width: 15px;
        height: 15px;
        background-color: transparent;
        border: 1px solid black;
        border-radius: 50%;
        cursor: pointer;
        transition: background-color 0.5s ease; /* Smooth fade-out effect */
      }

      /* Reset styles to prevent Wix conflicts */
      #body {
        overflow: hidden;
        margin: 0;
        height: 100vh;
      }

      #rolodex-app * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      #rolodex-app {
        font-family: "Noto Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 200;
        font-size: 14px;
        font-style: normal;
        font-variation-settings: "wdth" 100;
        padding: 0;
        width: 100%;
        /* height: auto; */
        height: 95vh;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center; /* Center horizontally */
        align-items: flex-start; /* Align to top */
      }

      .header {
        width: 100%;
        height: 100px;
        overflow: hidden;
        display: flex;
        justify-content: center;
        position: relative;
        padding: 20px;
      }

      .dot {
        position: absolute;
        height: 15px;
        width: 15px;
        background-color: transparent;
        border: 1px solid black;
        border-radius: 50%;
        cursor: pointer;
        z-index: 10;
      }

      /* Positioning the dots in a triangle formation */
      #dot1 {
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
      }

      #dot1::after {
        content: "Rolodex Homepage";
        font-family: "Noto Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 300;
        font-size: 10px;
        font-style: normal;
        font-variation-settings: "wdth" 100;
        position: absolute;
        top: -20px;
        left: 50%;
        transform: translateX(10%);
        background-color: black;
        color: white;
        padding: 2px 8px;
        border-radius: 5px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
        pointer-events: none;
        z-index: 15;
      }

      #dot1:hover::after {
        opacity: 1;
      }

      #dot2 {
        top: 60px;
        left: calc(50% - 30px);
      }

      #dot2::after {
        content: "Elaine W Ho's Bio";
        font-family: "Noto Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 300;
        font-size: 10px;
        font-style: normal;
        font-variation-settings: "wdth" 100;
        position: absolute;
        top: -20px;
        left: 50%;
        transform: translateX(-110%);
        background-color: black;
        color: white;
        padding: 2px 8px;
        border-radius: 5px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
        pointer-events: none;
        z-index: 15;
      }

      #dot2:hover::after {
        opacity: 1;
      }

      #dot3 {
        top: 60px;
        left: calc(50% + 15px);
        background-color: black;
      }

      #dot3::after {
        content: "Refresh Content";
        font-family: "Noto Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 300;
        font-size: 10px;
        font-style: normal;
        font-variation-settings: "wdth" 100;
        position: absolute;
        top: -20px;
        left: 50%;
        transform: translateX(10%);
        background-color: black;
        color: white;
        padding: 2px 8px;
        border-radius: 5px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
        pointer-events: none;
        z-index: 15;
      }

      #dot3:hover::after {
        opacity: 1;
      }

      .container {
        display: flex;
        flex-direction: column;
        width: 100%; /* Use full width */
        max-width: 100%;
        height: calc(
          100vh - 120px
        ); /* Adjust height based on screen minus header */
        margin: 0 auto;
        overflow-y: auto; /* Ensure vertical scrolling */
        position: relative;
        align-items: center; /* Center content horizontally */
      }

      .paragraph {
        margin-bottom: 3rem; /* Increased space between paragraphs */
        opacity: 1;
        transition: opacity 1s ease-out;
        width: 100%;
        text-align: left; /* Left align text */
        max-width: 100%; /* Allow paragraphs to take full width */
        padding: 0; /* Remove any default padding */
      }

      .sentence {
        display: inline;
        opacity: 0;
        transform: translateY(10px);
        transition:
          opacity 0.6s ease-out,
          transform 0.6s ease-out;
        text-align: left; /* Left align text */
      }

      .visible {
        opacity: 1 !important;
        transform: translateY(0);
      }

      .italic {
        font-style: italic;
      }

      .active {
        opacity: 1;
      }

      #fullpiece {
        width: 96%; /* Take up almost full width */
        /* min-height: fit-content; */
        height: 100vh;
        padding: 20px 0px 20px 0px;
        overflow: visible; /* Changed from scroll to visible */
        position: relative;
        text-align: left; /* Left align text content */
        margin: 0 auto; /* Center the content area */
      }

      .full-visible {
        opacity: 1 !important;
        transition: opacity 2s ease-in-out;
      }

      .keyword {
        position: absolute;
        color: black;
        opacity: 1;
        transition: opacity 0.5s ease-out;
        font-style: italic;
        pointer-events: none; /* Prevent keywords from blocking clicks */
      }

      .fade-out {
        opacity: 0;
      }
      #comp-m6yzx843inlineContent-gridContainer {
        min-height: unset !important; /* Remove the forced min-height */
        height: auto !important; /* Allow the content to define height */
        overflow: visible !important; /* Prevent unwanted scrolling */
      }
      [data-mesh-id="comp-m6z0g5au"] {
        min-height: "100vh" !important;
      }

      /* Toggle styling */
      .toggle {
        display: flex;
        flex-direction: row;
        align-items: center;
        position: absolute;
        z-index: 99;
        right: 1rem;
        top: 1rem;
        font-family: "Noto Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 300;
        font-size: 13px;
        font-style: normal;
        font-variation-settings: "wdth" 87.5;
      }
      /* The box around the toggle */
      .switch {
        position: relative;
        display: inline-block;
        width: 2rem;
        height: 0.9rem;
        margin: 0rem 0.4rem !important;
      }

      /* Hide default HTML checkbox */
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      /* The slider */
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #9e9e9e;
        -webkit-transition: 0.4s;
        transition: 0.4s;
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 0.7rem;
        width: 0.7rem;
        left: 0.1rem;
        bottom: 0.1rem;
        background-color: white;
        -webkit-transition: 0.4s;
        transition: 0.4s;
      }

      input:checked + .slider {
        background-color: #9e9e9e;
      }

      input:focus + .slider {
        box-shadow: 0 0 1px #9e9e9e;
      }

      input:checked + .slider:before {
        -webkit-transform: translateX(1.1rem);
        -ms-transform: translateX(1.1rem);
        transform: translateX(1.1rem);
      }

      /* Rounded sliders */
      .slider.round {
        border-radius: 34px;
      }

      .slider.round:before {
        border-radius: 50%;
      }

      /* Responsive adjustments */
      @media (max-width: 768px) {
        #fullpiece {
          width: 92%; /* Slightly narrower on tablets */
          padding: 20px 4%; /* Larger percentage padding on smaller screens */
        }
      }

      @media (max-width: 480px) {
        #fullpiece {
          width: 90%; /* Even narrower on phones */
          padding: 20px 5%; /* Even larger percentage padding on phones */
        }
      }
    </style>
  </head>
  <body id="body">
    <div class="entry-overlay">
      <p class="prompt-text">A TRUTH CONSIDERED</p>
      <div id="entry-dot"></div>
    </div>
    <main id="rolodex-app">
      <div class="header">
        <div class="dot" id="dot1" role="button"></div>
        <div class="dot" id="dot2" role="button"></div>
        <div class="dot" id="dot3" role="button"></div>
      </div>
      <div class="toggle">
        <p class="toggle-label-interactive italic">interactive read</p>
        <label class="switch">
          <input id="myInput" type="checkbox" />
          <span class="slider round"></span>
        </label>
        <p class="toggle-label-essay">full essay</p>
      </div>
      <div class="container">
        <div class="elaine" id="fullpiece"></div>
        <div class="elaine" id="keywords"></div>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
