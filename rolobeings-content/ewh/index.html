<!doctype html>
<html lang="en">

<head>
  <link rel="stylesheet" href="../../global.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wdth,wght@0,62.5..100,100..900;1,62.5..100,100..900&display=swap"
    rel="stylesheet" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elaine W Ho</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
  <style>
    body {
      background-color: var(--yellow);
    }

    /* Reset styles to prevent Wix conflicts */
    #body {
      overflow: hidden;
      margin: 0;
      height: 100vh;
    }

    #rolodex-app * {
      box-sizing: border-box;
      margin: 0;
    }

    #rolodex-app {
      font-family: "Noto Sans", sans-serif;
      font-optical-sizing: auto;
      font-weight: 200;
      font-size: 14px;
      font-style: normal;
      font-variation-settings: "wdth" 100;
      padding: 0;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      /* Center horizontally */
      align-items: flex-start;
      /* Align to top */
    }

    .header {
      width: 100%;
      height: 100px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      position: relative;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 100%;
      height: 88%;
      overflow-y: auto;
      position: relative;
      align-items: center;
    }

    .paragraph {
      margin-bottom: 3rem;
      /* Increased space between paragraphs */
      opacity: 1;
      transition: opacity 1s ease-out;
      width: 100%;
      text-align: left;
      /* Left align text */
      max-width: 100%;
      /* Allow paragraphs to take full width */
      padding: 0;
      /* Remove any default padding */
    }

    .sentence {
      display: inline;
      opacity: 0;
      transform: translateY(10px);
      transition:
        opacity 0.6s ease-out,
        transform 0.6s ease-out;
      text-align: left;
      /* Left align text */
    }

    .visible {
      opacity: 1 !important;
      transform: translateY(0);
    }

    .italic {
      font-style: italic;
    }

    .active {
      opacity: 1;
    }

    #fullpiece {
      width: 96%;
      /* Take up almost full width */
      /* min-height: fit-content; */
      height: 100vh;
      padding: 40px 20px 100px 20px;
      overflow: visible;
      /* Changed from scroll to visible */
      position: relative;
      text-align: left;
      /* Left align text content */
      margin: 0 auto;
      /* Center the content area */
    }

    .full-visible {
      opacity: 1 !important;
      transition: opacity 2s ease-in-out;
    }

    .keyword {
      position: absolute;
      color: var(--black);
      opacity: 1;
      transition: opacity 0.5s ease-out;
      font-style: italic;
      pointer-events: none;
      /* Prevent keywords from blocking clicks */
    }

    .fade-out {
      opacity: 0;
    }

    #comp-m6yzx843inlineContent-gridContainer {
      min-height: unset !important;
      /* Remove the forced min-height */
      height: auto !important;
      /* Allow the content to define height */
      overflow: visible !important;
      /* Prevent unwanted scrolling */
    }

    [data-mesh-id="comp-m6z0g5au"] {
      min-height: "100vh" !important;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      #fullpiece {
        width: 92%;
        /* Slightly narrower on tablets */
        padding: 20px 4%;
        /* Larger percentage padding on smaller screens */
      }
    }

    @media (max-width: 480px) {
      #fullpiece {
        width: 90%;
        /* Even narrower on phones */
        padding: 20px 5%;
        /* Even larger percentage padding on phones */
      }
    }

    /* Fade effect for scrolling text */
    /* Firefox */
    .text-slide {
      scrollbar-width: none;
      /* Hides scrollbar */
      -ms-overflow-style: none;
      /* IE/Edge */
    }

    .text-slide {
      -ms-overflow-style: none;
      /* IE/Edge */
      scrollbar-width: none;
      /* Firefox */

      /* Create fade effect at top & bottom */
      -webkit-mask-image: linear-gradient(to bottom,
          transparent,
          black 15%,
          black 80%,
          transparent);
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-size: 100% 100%;
      mask-image: linear-gradient(to bottom,
          transparent,
          black 15%,
          black 80%,
          transparent);
      mask-repeat: no-repeat;
      mask-size: 100% 100%;
    }

    .text-slide::-webkit-scrollbar {
      display: none;
      /* Chrome/Safari */
    }

    /* Mobile overlay CSS */
    .mobile-only {
      display: flex;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 999;
      position: absolute;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: var(--grey);
    }

    @media (min-width: 769px) {
      .mobile-only {
        display: none;
      }
    }

    @media (max-width: 769px) {
      .header {
        display: none;
      }

      .container {
        display: none;
      }

      .footer {
        display: none;
      }

      .mobile-only {
        display: flex;
      }
    }
  </style>
</head>

<body id="body">
  <script src="/components/dotnav.js"></script>
  <script src="/components/entryDot.js"></script>
  <script src="/components/essayToggle.js" defer></script>
  <script src="/components/rolodexTitle.js"></script>
  <script src="/components/mobileOverlay.js"></script>

  <mobile-overlay class="mobile-only"></mobile-overlay>

  <entry-dot id="entryDot"></entry-dot>
  <dot-nav id="dotNav"></dot-nav>
  <main id="rolodex-app">
    <essay-toggle></essay-toggle>
    <div class="container text-slide">
      <div class="elaine" id="fullpiece"></div>
      <div class="elaine" id="keywords"></div>
    </div>
  </main>
  <script src="/rolobeings-content/ewh/script.js"></script>
</body>

</html>
