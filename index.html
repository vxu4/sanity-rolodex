  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .noto-sans-rolodex {
      font-family: "Noto Sans", sans-serif;
      font-optical-sizing: auto;
      font-weight: 300;
      font-style: normal;
      font-variation-settings: "wdth" 87.5;
    }

    html,
    body {
      height: 100%;
      /* display: flex;
             justify-content: center; */
      align-items: center;
      font-family: "Noto Sans", sans-serif;
      overflow: hidden;
      /* Hide scrollbars */
    }

    .justify-content-center {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      width: 100%;
    }

    .italic {
      font-style: italic;
    }

    .black {
      background-color: var(--black) !important;
    }

    main {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    .header {
      display: flex;
      justify-content: right;
      align-items: end;
      flex-direction: column;
      width: 100%;
    }

    .footer {
      position: absolute;
      bottom: 1rem;
      display: flex;
      justify-content: right;
      align-items: end;
      flex-direction: column;
      width: 100%;
    }

    .container {
      position: absolute;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;

    }

    .dot-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }

    .rololand-index {
      flex-direction: row;
      display: flex;
      justify-content: center;
      align-items: start;
      width: 100%;
      opacity: 1;
      transition: opacity 1s;
    }

    .category-title {
      padding-bottom: 0.8rem;
      font-family: "Noto Sans", sans-serif;
      font-optical-sizing: auto;
      font-weight: 300;
      font-size: 15px;
      font-style: normal;
      font-variation-settings: "wdth" 87.5;
      color: var(--black);
    }

    .index-list {
      font-family: "Noto Sans", sans-serif;
      font-optical-sizing: auto;
      font-weight: 200;
      font-size: 14px;
      font-style: normal;
      font-variation-settings: "wdth" 100;
      color: var(--black);

      /* justify-content: center; */
      padding: 0rem 4rem;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 5px;
      /* Width of the scrollbar */
    }

    ::-webkit-scrollbar-track {
      background: transparent;
      /* Background of the scrollbar track */
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(89, 89, 89, 0.2);
      /* Color of the scrollbar handle */
      border-radius: 5px;
      /* Rounded corners */
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(89, 89, 89, 0.3);
      /* Handle color on hover */
    }

    .index-list-content {
      display: flex;
      flex-direction: column;
      align-items: start;
      height: 75vh;
      overflow: scroll;

      padding-top: 1rem;
      padding-bottom: 2rem;

      /* No scrollbar styling */
      /* -ms-overflow-style: none;
             /* IE/Edge */
      /* scrollbar-width: none; */
      /* Firefox */

      /* Create fade effect at top & bottom */
      -webkit-mask-image: linear-gradient(to bottom,
          transparent,
          black 5%,
          black 70%,
          transparent);
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-size: 100% 100%;
      mask-image: linear-gradient(to bottom,
          transparent,
          black 5%,
          black 70%,
          transparent);
      mask-repeat: no-repeat;
      mask-size: 100% 100%;
    }

    .index-line {
      display: flex;
      flex-direction: row;
      align-items: center;
    }

    .index-line-text {
      padding: 1rem;
      /* cursor: pointer; */
    }

    .hide {
      display: none;
    }

    .hidden {
      opacity: 0;
      transition: opacity 1s;
      z-index: -10;
    }

    .zIndex999 {
      z-index: 999;
    }

    /* .merged {
             transform: translateX(0);
           } */

    .dot {
      width: 1.375rem;
      height: 1.375rem;
      background-color: var(--black);
      border-radius: 50%;
    }

    .rolodex-dot {
      position: absolute;
      z-index: 999;
    }

    /* Toggle styling */
    .toggle {
      font-family: "Noto Sans", sans-serif;
      font-optical-sizing: auto;
      font-weight: 300;
      font-size: 13px;
      font-style: normal;
      font-variation-settings: "wdth" 87.5;
      color: var(--black);
      display: flex;
      flex-direction: row;
      align-items: center;
      position: absolute;
      right: 1rem;
      top: 1rem;
      transition: opacity 1s;
      z-index: 999;
    }

    /* The box around the toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 2rem;
      height: 0.9rem;
      margin: 0rem 0.4rem;
    }

    /* Hide default HTML checkbox */
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    /* The slider */
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--grey);
      -webkit-transition: 0.4s;
      transition: 0.4s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 0.7rem;
      width: 0.7rem;
      left: 0.1rem;
      bottom: 0.1rem;
      background-color: var(--white);
      -webkit-transition: 0.4s;
      transition: 0.4s;
    }

    input:checked+.slider {
      background-color: var(--grey);
    }

    input:focus+.slider {
      box-shadow: 0 0 1px var(--grey);
    }

    input:checked+.slider:before {
      -webkit-transform: translateX(1.1rem);
      -ms-transform: translateX(1.1rem);
      transform: translateX(1.1rem);
    }

    /* Rounded sliders */
    .slider.round {
      border-radius: 34px;
    }

    .slider.round:before {
      border-radius: 50%;
    }

    .mobile-only {
      display: flex;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 999;
      position: absolute;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: var(--grey);
    }

    @media (min-width: 769px) {
      .mobile-only {
        display: none;
      }
    }

    @media (max-width: 769px) {
      .header {
        display: none;
      }

      .container {
        display: none;
      }

      .footer {
        display: none;
      }

      .mobile-only {
        display: flex;
      }
    }
  </style>
</head>

<body>
  <script src="/components/rolodexTitle.js"></script>
  <script src="/components/mobileOverlay.js"></script>
  <script src="/components/copyrightNotice.js"></script>

  <main>
    <mobile-overlay class="mobile-only"></mobile-overlay>

    <div class="header">
      <div class="toggle hidden">
        <p class="toggle-label-interactive italic">rolodex</p>
        <label class="switch">
          <input id="myInput" type="checkbox" />
          <span class="slider round"></span>
        </label>
        <p class="toggle-label-essay">rololand</p>
      </div>
    </div>
    <div class="container zIndex900" id="containers">
      <div class="dot-container"></div>
      <rolodex-title clickable></rolodex-title>
    </div>
    <div class="rololand-index hidden">
      <div class="index-list">
        <p class="category-title">roloform</p>
        <div class="index-list-content" id="index-roloform"></div>
      </div>
      <div class="index-list">
        <p class="category-title">rolobeing</p>
        <div class="index-list-content" id="index-rolobeing"></div>
      </div>
    </div>
    <div class="footer">
      <copyright-notice variant="aft"></copyright-notice>

    </div>
  </main>
  <script>
    const rolodex = document.querySelector(".rolodex");
    const dots = document.querySelectorAll(".solid-circle");
    const letters = document.querySelectorAll(".letter:not(.o)");
    const betaTxt = document.getElementById("beta-text");
    const footnote = document.getElementsByClassName("footer")[0];

    const toggle = document.querySelector(".toggle");
    const container = document.querySelector(".dot-container");
    const indexRoloform = document.getElementById("index-roloform");
    const indexRolobeings = document.getElementById("index-rolobeing");
    const rololandContainer = document.querySelector(".rololand-index");
    const rolodexContainer = document.querySelector(".container");

    let hiddenFound = false;
    let executed = false;
    let rololand = false;

    const rolodexTitle = document.querySelector("rolodex-title");
    rolodexTitle.generateDots = generateDots;

    //Toggle constatns
    const interactiveText = document.getElementsByClassName(
      "toggle-label-interactive",
    )[0];
    const essayText =
      document.getElementsByClassName("toggle-label-essay")[0];

    // Attach event listeners after DOM loads
    const inputEl = document.getElementById("myInput");

    // If landing page has been displayed before, it is set to true in localstorage, and the landing view is hidden
    // If the toggle state view of rololand/rolodex is set to rololand, display that while generateDots() happens in bg
    if (localStorage.getItem("landing")) {
      letters.forEach((letter) => {
        if (letter.classList.contains("hidden")) {
          hiddenFound = true;
        } else {
          letter.classList.add("hidden");
        }
      });
      if (localStorage.getItem("rololand") === "true") {
        inputEl.checked = true;
        localStorage.setItem("rololand", inputEl.checked);
        rololand = localStorage.getItem("rololand") === "true";
        displayRololand();
        setTimeout(generateDots(), 100);
      } else {
        generateDots();
      }
      toggle.classList.remove("hidden");

      // Change copyright text after enetering animation:
      const copyright = document.querySelector("copyright-notice");
      console.log(copyright);
      copyright?.setAttribute("variant", "rolodex");
    }

    // Function to generate dots, link them with url's and info, as well as generate dots/names for index list

      const links = [

        },
        {

        {

        {

        },
        // {

        //   name: "nickolas calabrese",
        //   url: "https://www.rolodex.cc/nc",
        //   color: "#800080",
        //   category: "rolobeing",
        // },
        {
          index: 13,

        },
        {

        },
        {
          index: 15,

        },
        {

        },

        {
          index: 17,

          url: null,

        },
        {
          index: 18,

          url: null,

        },
        {

          name: "julia c liu & mei zyvb (in progress)",
          url: null,
          color: "#9E9E9E",
          category: "rolobeing",
        },
        {
          index: 20,
          name: "philip deng & anitha pai (in progress)",
          url: null,
          color: "#9E9E9E",
          category: "rolobeing",
        },

        // {
        //   index: 18,
        //   name: "seonyoung park + cici wu (in progress)",
        //   url: null,

        // },
        // {
        //   index: 19,
        //   name: "sakura maku (in progress)",
        //   url: null,
        //   color: "#9E9E9E",
        //   category: "rolobeing",
        // },
      ];

      // Create and append dots
      for (let i = 0; i < links.length; i++) {
        const dotIsActive = links[i].url != null;
        const dot = document.createElement("div");
        dot.classList.add("dot");
        //differentiating the dots that should move
        dot.classList.add("rolodex-dot");
        dot.style.display = "block";
        // For each generated dot:
        dot.style.position = "absolute";
        dot.style.left = `${originX}px`;
        dot.style.top = `${originY}px`;
        dot.style.transition = "none";
        dot.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 360}deg)`;


        if (dotIsActive) {
          dot.style.cursor = "pointer";
        }

        // Code for getting items from array in localstorage
        dot.style.backgroundColor = localStorage.getItem(links[i].name)
          ? links[i].color
          : "black";

        dot.onclick = () => {
          if (dotIsActive) {
            localStorage.setItem(links[i].name, true);

            window.parent.location.href = links[i].url;
          }
        };

        dot.addEventListener("click", () => {
          if (dotIsActive) {
            localStorage.setItem(links[i].name, true);

            dot.style.backgroundColor = links[i].color;
          }
        });

        dot.addEventListener("mouseover", () => {
          if (dotIsActive) {
            dot.style.backgroundColor = links[i].color;
          }
        });

        dot.addEventListener("mouseout", () => {
          if (dotIsActive) {
            dot.style.backgroundColor = localStorage.getItem(links[i].name)
              ? links[i].color
              : "black";
          }
        });

        //appending dot to rolodex (freeflow world)
        container.appendChild(dot);

        //appending dot to rololand (index)
        const dotIndex = document.createElement("div");
        dotIndex.classList.add("dot");
        dotIndex.style.display = "block";

        if (dotIsActive) {
          dotIndex.style.cursor = "pointer";
        }

        dotIndex.style.backgroundColor = localStorage.getItem(links[i].name)
          ? "black"
          : links[i].color;

        dotIndex.onclick = () => {
          if (dotIsActive) {
            localStorage.setItem(links[i].name, true);
            window.parent.location.href = links[i].url;
          }
        };

        dotIndex.addEventListener("click", () => {
          if (dotIsActive) {
            localStorage.setItem(links[i].name, true);

            dotIndex.style.backgroundColor = "black";
          }
        });
        const rolobeingName = document.createElement("p");
        rolobeingName.textContent = links[i].name;
        rolobeingName.classList.add("index-line-text");
        const rolobeingInfo = document.createElement("div");
        rolobeingInfo.classList.add("index-line");
        rolobeingInfo.appendChild(dotIndex);
        rolobeingInfo.appendChild(rolobeingName);
        if (dotIsActive) {
          rolobeingName.style.cursor = "pointer";
        }
        rolobeingName.onclick = () => {
          if (dotIsActive) {
            localStorage.setItem(links[i].name, true);
            window.parent.location.href = links[i].url;
            rolobeingName.style.cursor = "pointer";
          }
        };

        rolobeingName.addEventListener("click", () => {
          if (dotIsActive) {
            localStorage.setItem(links[i].name, true);

            dotIndex.style.backgroundColor = "black";
          }
        });
        if (links[i].category === "roloform") {
          indexRoloform.appendChild(rolobeingInfo);
        } else if (links[i].category === "rolobeing") {
          indexRolobeings.appendChild(rolobeingInfo);
        }
      }

      const dots = document.querySelectorAll(".rolodex-dot");

      // Preserve the actual convergence point
      dots.forEach((dot) => {
        dot.style.transition = "none";
        dot.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 360}deg)`;
      });

      void dots[0].offsetWidth; // force reflow

      // --- movement logic based on screen size ---
      function moveDot(dot) {
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;

        const maxDistanceX = screenWidth * 0.4;
        const maxDistanceY = screenHeight * 0.4;

        const angle = Math.random() * Math.PI * 2;
        const translateX = Math.cos(angle) * maxDistanceX;
        const translateY = Math.sin(angle) * maxDistanceY;

        dot.style.transition = "transform 15s linear";
        dot.style.transform = `
          translate(-50%, -50%)
          translate(${translateX}px, ${translateY}px)
          rotate(${Math.random() * 360}deg)
        `;
      }

      // Move and animate dots
      dots.forEach((dot) => {
        moveDot(dot); // first move

        dot.addEventListener("transitionend", () => {
          moveDot(dot); // move again when finished
        });

        // Hover pause/resume
        dot.addEventListener("mouseover", () => {
          const computedTransform = window.getComputedStyle(dot).transform;

          // Freeze the dot at its current visual position
          dot.style.transition = "none";
          dot.style.transform = computedTransform;
        });

        dot.addEventListener("mouseout", () => {
          moveDot(dot);
        });
      });

      // On screen resize, re-trigger motion to adjust to new screen size
      window.addEventListener("resize", () => {
        dots.forEach((dot) => {
          moveDot(dot); // adapt to new screen dimensions
        });
      });
    }

    // Trigger when input gets focus (selected)
    inputEl.addEventListener("click", onInputSelected);

    // Function to run when input is selected (focused)
    function onInputSelected() {
      rololand = !rololand;
      if (rololand) {
        displayRololand();
      } else {
        displayRolodex();
      }
    }

    // Function to display the rololand index view
    function displayRololand() {
      localStorage.setItem("rololand", rololand);
      essayText.classList.add("italic");
      interactiveText.classList.remove("italic");
      rololandContainer.classList.remove("hidden");
      rolodexContainer.classList.remove("zIndex900");
      rolodexContainer.classList.add("hidden");
      rololandContainer.classList.add("zIndex900");
      dots.forEach((dot) => {
        dot.classList.add("hidden"); // making dots invisible, but allowing animation to continue
      });
    }

    // Function to display the rolodex moving dot universe view
    function displayRolodex() {
      localStorage.setItem("rololand", false);
      essayText.classList.remove("italic");
      interactiveText.classList.add("italic");
      rololandContainer.classList.add("hidden");
      rolodexContainer.classList.add("zIndex900");
      rolodexContainer.classList.remove("hidden");
      rololandContainer.classList.remove("zIndex900");
      dots.forEach((dot) => {
        dot.classList.remove("hidden"); // making dots invisible, but allowing animation to continue
      });
    }
  </script>
</body>

</html>
